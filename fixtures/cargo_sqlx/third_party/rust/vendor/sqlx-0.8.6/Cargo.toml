[package]
name = "sqlx"
version = "0.8.6"
edition = "2021"

[dependencies]
sqlx-postgres = { version = "=0.8.6", optional = true }
sqlx-sqlite = { version = "=0.8.6", optional = true }

[features]
default = ["sqlite"]
postgres = ["dep:sqlx-postgres"]
sqlite = ["dep:sqlx-sqlite"]
migrate = ["sqlx-postgres?/migrate", "sqlx-sqlite?/migrate"]
